spring:
  application:
    name: StartYuanReftain
  datasource:
    url: ${StartYuan_DB_URL:jdbc:mysql://localhost:3305/startyuan}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${StartYuan_DB_USERNAME:root}
    password: ${StartYuan_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never

server:
  port: ${StartYuan_SERVER_PORT:8809}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

niuma:
  security:
    jwt:
      issuer: ${StartYuan_JWT_ISSUER:urn:niuma:startyuan:auth}
      audience: ${StartYuan_JWT_AUDIENCE:niuma-game-api}
      access-token-ttl: ${StartYuan_JWT_ACCESS_TOKEN_TTL:30m}
      secret-base64: ${StartYuan_JWT_SECRET_BASE64:}
