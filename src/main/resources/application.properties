spring.application.name=StartYuanReftain

server.port=${StartYuan_SERVER_PORT:8809}

spring.datasource.url=${StartYuan_DB_URL:jdbc:mysql://localhost:3305/startyuan}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${StartYuan_DB_USERNAME:root}
spring.datasource.password=${StartYuan_DB_PASSWORD:}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml


management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

niuma.security.jwt.issuer=${StartYuan_JWT_ISSUER:urn:niuma:startyuan:auth}
niuma.security.jwt.audience=${StartYuan_JWT_AUDIENCE:niuma-game-api}
niuma.security.jwt.access-token-ttl=${StartYuan_JWT_ACCESS_TOKEN_TTL:30m}
niuma.security.jwt.secret-base64=${StartYuan_JWT_SECRET_BASE64:}

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
